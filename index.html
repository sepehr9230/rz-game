<div id="playerList" class="player-list">
  <h2>Players</h2>
</div>

<script>

function selectButton(button) {
  document.querySelectorAll('.overall1').forEach(function(item) {
    item.classList.remove('selected');
  });

  button.classList.add('selected');

  const type = button.querySelector('span').textContent.trim();
  const list = document.getElementById('playerList');

  const categoryNames = {
    overall: 'Overall',
    vanilla: 'Vanilla',
    uhc: 'Uhc',
    sword: 'Sword',
    axe: 'Axe',
    smp: 'Smp',
    mace: 'Mace',
    pot: 'Pot',
    nethop: 'Nethop'
  };

  const selectedPlayers = players[categoryNames[type]];

  list.innerHTML = '<h2>' + type.toUpperCase() + ' Players</h2>';

  if (!selectedPlayers) {
    list.innerHTML += '<p>No players found.</p>';
    return;
  }

  selectedPlayers.forEach(function(player, index) {
    const item = document.createElement('div');
    item.className = 'player-item';

    const img = document.createElement('img');
    img.src = player.icon;
    img.alt = player.name;
    img.style.width = '40px';
    img.style.height = '40px';
    img.style.objectFit = 'contain';

    const name = document.createElement('span');
    name.textContent = player.name;

    const rank = document.createElement('span');
    rank.textContent = '#' + (index + 1);
    rank.style.marginLeft = 'auto';
    rank.style.color = '#b1b1b1';

    item.style.display = 'flex';
    item.style.alignItems = 'center';
    item.style.gap = '12px';
    item.style.padding = '8px';
    item.style.margin = '6px 0';
    item.style.background = '#303030';
    item.style.borderRadius = '10px';

    item.appendChild(img);
    item.appendChild(name);
    item.appendChild(rank);
    list.appendChild(item);
  });
}
